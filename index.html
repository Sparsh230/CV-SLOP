 async function extractChatFile(file){const ext=(file.name.split('.').pop()||'').toLowerCase();const allowedMimes={pdf:['application/pdf','application/octet-stream'],docx:['application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/octet-stream',''],txt:['text/plain','application/octet-stream','']};if(!['pdf','docx','txt'].includes(ext)||file.size>8*1024*1024||!file.size){notify('Choose a non-empty PDF, DOCX, or TXT file under 8 MB.','error');return;}if(file.type&&!(allowedMimes[ext]||[]).includes(file.type)){notify('The file type does not match its extension. Choose a valid PDF, DOCX, or TXT file.','error');return;}try{let text='';if(ext==='txt')text=await file.text();else if(ext==='pdf'){if(!window.pdfjsLib)throw new Error('PDF.js could not load.');const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;if(pdf.numPages>50)throw new Error('PDF has more than 50 pages.');const pages=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);pages.push((await p.getTextContent()).items.map(t=>t.str).join(' '))}text=pages.join('\n\n')}else{if(!window.mammoth)throw new Error('Mammoth.js could not load.');text=(await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value||''}if(!text.trim())throw new Error('No readable text found. Try a text-based PDF or paste the text.');setChatFileName(file.name);setChatFileText(text.slice(0,45000));notify('File extracted. Press Send to share its text with Gemini.')}catch(e){notify(e?.message||'Could not read file.','error')}}
 const reportSection=(title,items,kind='normal')=><div className="reportblock"><h3>{title}</h3>{Array.isArray(items)&&items.length?<div className="stack">{items.map((it,i)=>typeof it==='string'?<div className="finding" key={i}><p style={{margin:0}}>{it}</p></div>:<div className="finding" key={i}><div className="findinghead"><strong>{it.title||it.category||('Finding '+(i+1))}</strong>{it.severity&&<span className={'pill '+(it.severity==='High'?'error':it.severity==='Medium'?'warning':'')}>{it.severity}</span>}</div>{it.evidence&&<p><b>Evidence:</b> {it.evidence}</p>}{it.whyItMatters&&<p><b>Why it matters:</b> {it.whyItMatters}</p>}{it.reason&&<p><b>Assessment:</b> {it.reason}</p>}{it.fix&&<p><b>Suggested fix:</b> {it.fix}</p>}{it.revised&&<p><b>Revised:</b> {it.revised}</p>}{it.needsConfirmation&&it.confirmationQuestion&&<p><b>Confirm:</b> {it.confirmationQuestion}</p>}</div>)}</div>:<p className="muted small">No items returned.</p>}</div>;

    <div className="panel stack"><div className="between"><h2>Live CV preview</h2><select className="field" style={{maxWidth:155}} value={template} onChange={e=>setTemplate(e.target.value)} aria-label="CV template"><option value="modern">Modern</option><option value="classic">Classic</option><option value="minimal">Minimal</option></select></div>{jobDescription.trim()&&<button className="secondary" onClick={tailorCv} disabled={studioBusy}>{studioBusy?'Tailoring…':'Tailor edited CV to target job'}</button>}<div className="previewbox"><div id="cv-render" className={'cvpaper template-'+template}>{cvEdited.trim()?<CVPreview text={cvEdited} profile={cvProfile}/>:<div style={{textAlign:'center',padding:'90px 15px',color:'#666'}}><h1 style={{fontSize:22}}>Your CV preview</h1><p>Add details or generate a draft to see it here.</p></div>}</div></div>{studioVersion&&<details><summary className="small">AI edit notes / response details</summary><pre style={{whiteSpace:'pre-wrap',fontSize:11,color:'var(--muted)'}}>{studioVersion}</pre></details>}<button className="ghost" onClick={()=>window.print()}>Print / Save as PDF fallback</button></div></div></>}
   {page==='skills'&&<><div className="pagehead"><div><div className="eyebrow">Market research / Evidence first</div><h1 className="h1">Know what the market asks for.</h1><p className="lead">Search current job and skill information through Gemini Google Search grounding. Findings depend on returned sources and available API quota.</p></div><span className="pill">Gemini + Google Search</span></div><div className="panel stack"><div className="grid two"><div><label className="label">Target role or skill area</label><input className="field" value={skillQuery} onChange={e=>setSkillQuery(e.target.value)} placeholder="e.g. entry-level data analyst" onKeyDown={e=>e.key==='Enter'&&runSkills()}/></div><div><label className="label">Region / job market</label><input className="field" value={skillLocation} onChange={e=>setSkillLocation(e.target.value)} placeholder="e.g. India, remote, UK"/></div><div><label className="label">Experience level</label><select className="field" value={skillLevel} onChange={e=>setSkillLevel(e.target.value)}><option>All levels</option><option>Student / internship</option><option>Entry level / fresher</option><option>Mid-level</option><option>Senior</option></select></div><div><label className="label">Posting recency preference</label><select className="field" value={skillRecency} onChange={e=>setSkillRecency(e.target.value)}><option>past week</option><option>past month</option><option>past 3 months</option><option>all available recent sources</option></select></div></div><button className="primary" onClick={runSkills} disabled={skillBusy}>{skillBusy?'Researching sources…':'⌁ Research current skills'}</button><p className="hint">Only this feature enables Google Search grounding. Source links are displayed only when Gemini returns them. Search results are a sample, not a complete count of the job market.</p></div>{skillBusy&&<div className="panel sectiongap"><div className="row"><div className="typing"><span/><span/><span/></div><span className="muted">Searching and analysing sources…</span></div></div>}{skillResult&&<div className="panel sectiongap"><div className="between"><h2>Research findings</h2><span className="pill">Analysed {skillResult.at}</span></div><div className="bubble" style={{display:'block'}} dangerouslySetInnerHTML={{__html:renderMarkdown(skillResult.text)}}/>{skillResult.sources.length>0?<><div className="divider"/><h3>Grounded sources returned by Gemini</h3><div className="source-list">{skillResult.sources.map((s,i)=><a className="source-link" href={s.url} target="_blank" rel="noopener noreferrer" key={i}>↗ {s.title}</a>)}</div></>:<div className="sourcebox sectiongap">No source URLs were returned in metadata. Verify current claims independently; this result should not be treated as a fully source-verified live market report.</div>}<div className="row sectiongap" style={{flexWrap:'wrap'}}><button className="secondary" onClick={()=>copy(skillResult.text)}>Copy report</button><button className="secondary" onClick={()=>{setGoal(g=>({...g,role:skillQuery,location:skillLocation}));go('roadmap')}}>Build roadmap for this role →</button><button className="ghost" onClick={()=>{const rep={id:Date.now().toString(36),name:'Skill Radar: '+skillQuery,createdAt:new Date().toISOString(),type:'market',text:skillResult.text,sources:skillResult.sources};setSavedReports(old=>[rep,...old].slice(0,30));notify('Market report saved.')}}>Save research</button></div></div>}</>}
   {page==='roadmap'&&<><div className="pagehead"><div><div className="eyebrow">Learning system / Build capability</div><h1 className="h1">Turn a goal into a roadmap.</h1><p className="lead">Get a realistic plan with prerequisites, practice, projects, and measurable completion criteria. Progress is self-reported.</p></div></div><div className="grid two"><div className="panel stack"><h2>Personalise your roadmap</h2><div><label className="label">Target career / role *</label><input className="field" value={goal.role} onChange={e=>setGoal({...goal,role:e.target.value})} placeholder="e.g. AI engineer, frontend developer"/></div><div className="grid two"><div><label className="label">Current level</label><select className="field" value={goal.level} onChange={e=>setGoal({...goal,level:e.target.value})}><option>Beginner</option><option>Some fundamentals</option><option>Intermediate</option><option>Experienced</option><option>Career switcher</option></select></div><div><label className="label">Study hours per week</label><input className="field" type="number" min="1" max="80" value={goal.hours} onChange={e=>setGoal({...goal,hours:Math.max(1,Math.min(80,Number(e.target.value)||1))})}/></div><div><label className="label">Learning budget</label><select className="field" value={goal.budget} onChange={e=>setGoal({...goal,budget:e.target.value})}><option>Free</option><option>Low budget</option><option>Flexible</option></select></div><div><label className="label">Region</label><input className="field" value={goal.location} onChange={e=>setGoal({...goal,location:e.target.value})} placeholder="India / global"/></div></div><div><label className="label">Current skills, constraints, and interests (optional)</label><textarea className="field" rows="4" value={goal.notes} onChange={e=>setGoal({...goal,notes:e.target.value})} placeholder="What you already know, your deadlines, preferred tech…"/></div><button className="primary" onClick={generateRoadmap} disabled={roadmapBusy}>{roadmapBusy?'Building roadmap…':'Generate my roadmap'}</button><p className="hint">Gemini may use Google Search grounding for current resources. No hiring or mastery timeline is guaranteed.</p></div><div className="panel"><h2>Current progress</h2>{roadmap?<><div className="scorelayout"><div className="scorecircle"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="var(--panel3)" strokeWidth="9"/><circle cx="60" cy="60" r="48" fill="none" stroke="var(--accent)" strokeWidth="9" strokeLinecap="round" strokeDasharray={301.6} strokeDashoffset={301.6*(1-progress/100)}/></svg><div className="scoreinner"><div className="scorevalue">{progress}%</div><div className="scorelabel">SELF-REPORTED</div></div></div><div><h3>{roadmap.title}</h3><p className="muted small">{completedTasks} of {allTasks.length} tasks checked off</p><p className="hint">Checking a task records your progress; it does not independently verify mastery.</p></div></div><button className="ghost" style={{marginTop:12}} onClick={()=>{if(confirm('Delete the saved roadmap?')){setRoadmap(null);notify('Roadmap deleted.')}}}>Delete roadmap</button></>:<div className="empty">No roadmap yet. Enter your target role and create your first plan.</div>}</div></div>{roadmap&&<div className="panel sectiongap"><div className="between"><div><h2>{roadmap.title}</h2><p className="muted small">Estimated duration: {roadmap.estimatedWeeks||'Not specified'} weeks · Not a job guarantee</p></div><span className="pill">{progress}% complete</span></div>{roadmap.startingAssumptions?.length>0&&<div className="sourcebox"><b>Assumptions</b><ul className="bulletlist">{roadmap.startingAssumptions.map((x,i)=><li key={i}>{x}</li>)}</ul></div>}<div className="stack sectiongap">{roadmap.phases.map((p,pi)=><div className="roadmapphase" key={pi}><div className="phasehead"><div className="stat-icon">{String(pi+1).padStart(2,'0')}</div><div className="grow"><div className="between"><h3>{p.title}</h3><span className="pill">{p.duration||'Milestone'}</span></div><p className="muted small">{p.objective}</p></div></div>{p.topics?.length>0&&<div className="taglist sectiongap">{p.topics.map((t,i)=><span className="tag" key={i}>{t}</span>)}</div>}<div className="divider"/><h3>Tasks and practice</h3>{(p.tasks||[]).map((t,ti)=><label className="taskrow" key={ti}><input className="check" type="checkbox" checked={!!t.done} onChange={e=>toggleTask(pi,ti,e.target.checked)}/><span className="grow"><b style={{textDecoration:t.done?'line-through':'none',opacity:t.done ? 0.65 : 1}}>{t.title}</b><div className="muted small" style={{lineHeight:1.6,marginTop:3}}>{t.details}</div></span><span className="pill">{t.hours||'?'} h</span></label>)}{p.project&&<div className="sourcebox sectiongap"><b>Build:</b> {p.project}</div>}{p.completionCriteria?.length>0&&<div className="sectiongap"><b className="small">Completion criteria</b><ul className="bulletlist">{p.completionCriteria.map((x,i)=><li key={i}>{x}</li>)}</ul></div>}{p.resources?.length>0&&<div className="resource sectiongap">{p.resources.map((r,i)=>/^https?:\/\//i.test(r.url||'')?<a className="source-link" href={r.url} target="_blank" rel="noopener noreferrer" key={i}>↗ {r.title||r.url}</a>:<span className="source-link" key={i}>{r.title}{r.url?' — '+r.url:''}</span>)}</div>}</div>)}</div>{roadmap.milestones?.length>0&&<div className="reportblock"><h3>Milestones</h3><ul className="bulletlist">{roadmap.milestones.map((m,i)=><li key={i}>{m}</li>)}</ul></div>}{roadmap.limitations?.length>0&&<div className="reportblock"><h3>Limitations</h3><ul className="bulletlist">{roadmap.limitations.map((m,i)=><li key={i}>{m}</li>)}</ul></div>}<div className="row sectiongap" style={{flexWrap:'wrap'}}><button className="secondary" onClick={()=>copy(JSON.stringify(roadmap,null,2))}>Copy roadmap data</button><button className="ghost" onClick={generateRoadmap} disabled={roadmapBusy}>Recalculate / regenerate</button></div></div>}</>}
   {page==='projects'&&<><div className="pagehead"><div><div className="eyebrow">Proof of skill / Portfolio</div><h1 className="h1">Make your skills visible.</h1><p className="lead">Track projects and accomplishments that you can later choose to include in your CV.</p></div></div><div className="grid two"><div className="panel stack"><h2>Add a project</h2><div><label className="label">Project title *</label><input className="field" value={projectForm.title} onChange={e=>setProjectForm({...projectForm,title:e.target.value})} placeholder="e.g. Personal finance dashboard"/></div><div><label className="label">Description</label><textarea className="field" rows="4" value={projectForm.description} onChange={e=>setProjectForm({...projectForm,description:e.target.value})} placeholder="What did you build? What problem does it solve?"/></div><div><label className="label">Skills demonstrated</label><input className="field" value={projectForm.skills} onChange={e=>setProjectForm({...projectForm,skills:e.target.value})} placeholder="HTML, CSS, JavaScript…"/></div><div><label className="label">Project link (optional)</label><input className="field" value={projectForm.url} onChange={e=>setProjectForm({...projectForm,url:e.target.value})} placeholder="https://github.com/..."/></div><div><label className="label">Status</label><select className="field" value={projectForm.status} onChange={e=>setProjectForm({...projectForm,status:e.target.value})}><option>In progress</option><option>Completed</option><option>Planned</option></select></div><button className="primary" onClick={addProject}>Save project</button><p className="hint">Projects are stored in this browser. Only add claims you can honestly explain or demonstrate.</p></div><div className="panel"><div className="between"><h2>Your portfolio</h2><span className="pill">{projects.length} project{projects.length===1?'':'s'}</span></div>{projects.length? <div className="stack">{projects.map(p=><div className="finding" key={p.id}><div className="between"><b>{p.title}</b><span className="pill">{p.status}</span></div><p>{p.description||'No description added.'}</p>{p.skills&&<div className="taglist sectiongap">{p.skills.split(',').map((s,i)=><span className="tag" key={i}>{s.trim()}</span>)}</div>}{p.url&&/^https?:\/\//i.test(p.url)&&<p><a href={p.url} target="_blank" rel="noopener noreferrer">Open project ↗</a></p>}<div className="row sectiongap"><button className="secondary" onClick={()=>{setCvProfile(v=>({...v,projects:(v.projects?v.projects+'\n\n':'')+p.title+': '+p.description+' (Skills: '+p.skills+')'}));go('studio');notify('Project details added to the CV form. Review before generating.')}}>Add to CV form</button><button className="dangerbtn" onClick={()=>{if(confirm('Delete this project?'))setProjects(old=>old.filter(x=>x.id!==p.id))}}>Delete</button></div></div>)}</div>:<div className="empty">No projects saved yet. Add a real project and document the skills it demonstrates.</div>}</div></div></>}
   {page==='reports'&&<><div className="pagehead"><div><div className="eyebrow">Your workspace / Saved locally</div><h1 className="h1">Saved reports</h1><p className="lead">Reports and research you chose to save are stored in this browser's localStorage.</p></div><button className="dangerbtn" onClick={()=>{if(confirm('Delete all saved reports from this browser?')){setSavedReports([]);notify('Saved reports cleared.')}}}>Delete all</button></div>{savedReports.length?<div className="stack">{savedReports.map(item=><div className="panel" key={item.id}><div className="between"><div><h2>{item.name}</h2><p className="muted small">{new Date(item.createdAt).toLocaleString()} · {item.type==='market'?'Skill Radar report':'CV analysis'}</p></div><div className="row"><button className="secondary" onClick={()=>item.type==='market'?(setSkillResult({text:item.text,sources:item.sources||[],at:new Date(item.createdAt).toLocaleString()}),go('skills')):openReport(item)}>Open</button><button className="dangerbtn" onClick={()=>{if(confirm('Delete this report?'))setSavedReports(old=>old.filter(r=>r.id!==item.id))}}>Delete</button></div></div>{item.type==='market'?<p className="muted small">{item.text?.slice(0,280)}…</p>:<p className="muted small">CV quality score: {item.report?.overallScore??'Not available'}/100 {item.report?.jobMatch?'· Job match: '+item.report.jobMatch.score+'/100':''}</p>}</div>)}</div>:<div className="panel empty">No saved reports yet. Run a CV analysis or save a Skill Radar result to see it here.</div>}</>}
   {page==='settings'&&<><div className="pagehead"><div><div className="eyebrow">Preferences / Privacy</div><h1 className="h1">Settings & data</h1><p className="lead">Manage this browser's local data and understand what is sent to Gemini.</p></div></div><div className="grid two"><div className="panel stack"><h2>Appearance</h2><p className="muted small">Choose a theme that works for you.</p><div className="row"><button className={theme==='dark'?'primary':'secondary'} onClick={()=>setTheme('dark')}>☾ Dark</button><button className={theme==='light'?'primary':'secondary'} onClick={()=>setTheme('light')}>☼ Light</button></div><div className="divider"/><h2>Motion & accessibility</h2><p className="muted small">CV-SLOP respects the operating system's reduced-motion preference. Use Tab to navigate, and Enter or Space to activate controls.</p><div className="divider"/><h2>Connection</h2><div className="between"><span>Internet</span><span className={'pill '+(navigator.onLine?'success':'error')}>{navigator.onLine?'Browser reports online':'Offline'}</span></div><div className="between"><span>Gemini model</span><code>{MODEL}</code></div><div className="between"><span>PDF.js</span><span className={'pill '+(window.pdfjsLib?'success':'warning')}>{window.pdfjsLib?'Loaded':'Unavailable'}</span></div><div className="between"><span>Mammoth.js</span><span className={'pill '+(window.mammoth?'success':'warning')}>{window.mammoth?'Loaded':'Unavailable'}</span></div><div className="between"><span>PDF export</span><span className={'pill '+(window.html2pdf?'success':'warning')}>{window.html2pdf?'Loaded':'Unavailable'}</span></div></div><div className="panel stack"><h2>Privacy & storage</h2><p className="muted" style={{lineHeight:1.7}}>CV text and job descriptions are sent to Google's Gemini API only when you choose an AI action. Uploaded files are parsed locally in this browser and are not sent to a separate file-hosting service. Google processes the text sent in an API request under its applicable API terms.</p><p className="muted" style={{lineHeight:1.7}}>Chat history, saved reports, roadmaps, and projects may be kept in localStorage on this device. Browser storage is not encrypted secure storage. Anyone using this browser profile may be able to view the data.</p><div className="sourcebox"><b>API key warning</b><p className="small">Your Gemini API key is visible in this HTML file. Never publicly upload or share this key-bearing file. This browser-only version is for local testing, not secure production deployment.</p></div><div className="divider"/><b>Local storage usage</b><div className="grid two"><div className="finding"><div className="muted small">Chat messages</div><b>{messages.length}</b></div><div className="finding"><div className="muted small">Saved reports</div><b>{savedReports.length}</b></div><div className="finding"><div className="muted small">Projects</div><b>{projects.length}</b></div><div className="finding"><div className="muted small">Roadmap</div><b>{roadmap?'Saved':'None'}</b></div></div><button className="dangerbtn" onClick={()=>{if(confirm('Clear all CV-SLOP browser data, including chat, reports, roadmap, projects and draft CV? This cannot be undone.')){Object.values(STORE).forEach(k=>localStorage.removeItem(k));setMessages([]);setSavedReports([]);setRoadmap(null);setProjects([]);setCvText('');setCvEdited('');setReport(null);setChatFileName('');setChatFileText('');notify('CV-SLOP local data cleared.')}}}>Delete all local CV-SLOP data</button><div className="hint">This does not revoke your API key or delete information retained by an API provider under its own policies.</div></div></div></>}
  </div></main>
  {showConfirm&&<div className="modalback" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><div className="modal"><h2 id="confirm-title">Clear conversation?</h2><p className="muted" style={{lineHeight:1.7}}>This removes the visible chat and its saved conversation history from this browser. Saved CV reports, projects, and roadmaps remain unless you delete all data in Settings.</p><div className="row" style={{justifyContent:'flex-end'}}><button className="secondary" onClick={()=>setShowConfirm(false)}>Cancel</button><button className="dangerbtn" onClick={clearChat}>Clear chat</button></div></div></div>}
  {toast&&<div className="toastzone" role="status" aria-live="polite"><div className={'toast '+(toast.type==='error'?'error':'')}>{toast.type==='error'?'⚠ ':'✓ '}{toast.text}</div></div>}
 </div>;
}
function ScoreRing({score}){const n=Math.max(0,Math.min(100,Number(score)||0));const [shown,setShown]=useState(0);useEffect(()=>{let start=null;let raf;const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;const duration=reduced?1:700;const step=ts=>{if(start===null)start=ts;const p=Math.min(1,(ts-start)/duration);setShown(Math.round(n*p));if(p<1)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step);return()=>cancelAnimationFrame(raf)},[n]);const offset=301.6*(1-shown/100);return <div className="scorecircle" aria-label={'Score '+n+' out of 100'}><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="48" fill="none" stroke="var(--panel3)" strokeWidth="9"/><circle cx="60" cy="60" r="48" fill="none" stroke="var(--accent)" strokeWidth="9" strokeLinecap="round" strokeDasharray="301.6" strokeDashoffset={offset}/></svg><div className="scoreinner"><div className="scorevalue">{shown}</div><div className="scorelabel">OUT OF 100</div></div></div>}
function CVPreview({text,profile}){const sections=String(text||'').split(/\n(?=[A-Z][A-Z &/()-]{2,35}\s*\n?)/g);return <div>{profile?.name&&<h1>{profile.name}</h1>}{profile?.contact&&<p className="contact">{profile.contact}</p>}{!profile?.name&&!profile?.contact&&null}<div style={{whiteSpace:'pre-wrap',overflowWrap:'anywhere'}}>{text}</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
